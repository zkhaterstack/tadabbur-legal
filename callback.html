<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Tadabbur TikTok OAuth</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#243E35;">
  <h2>Tadabbur TikTok Authorization</h2>
  <p id="status">Completing authorization...</p>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state') || '';
    if (code) {
      location.replace(`https://zkhaterstack.github.io/tadabbur-legal/studio.html?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`);
    } else {
      document.getElementById('status').textContent = 'Authorization error: ' + location.search;
    }
  </script>
</body>
</html>
